<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Photo Gallery</h1>

    <div id="image">Hover over an image below to display here.</div>

    <div class="gallery">
        <img class="preview" src="images/tony.jpg" alt="Iron Man">
        <img class="preview" src="images/steve.jpg" alt="Captain America">
        <img class="preview" src="images/bruce.jpg" alt="Hulk">
        <img class="preview" src="images/thor.jpg" alt="Thor">
        <img class="preview" src="images/natasha.jpg" alt="Black Widow">
        <img class="preview" src="images/clint.jpg" alt="Hawkeye">
    </div>

    <script src="script.js"></script>
</body>
</html>
